<!DOCTYPE html>
<html lang="es">
 <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Feliz Cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Poppins', sans-serif;
  }
  canvas { display: block; touch-action: none; }

  #flash {
    position: fixed; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 5;
  }

  #skip {
    position: fixed; top: 18px; right: 18px; z-index: 10;
    padding: 8px 16px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.06); color: rgba(255,255,255,.7);
    font-family: 'Poppins', sans-serif; font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 1s ease;
  }
  #skip.show { opacity: 1; }

  #replay {
    position: fixed; bottom: 6%; left: 50%; transform: translateX(-50%);
    padding: 12px 28px; border-radius: 30px;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.06); color: #fff;
    font-family: 'Poppins', sans-serif; font-size: 13px; letter-spacing: 1.5px;
    text-transform: uppercase; cursor: pointer;
    opacity: 0; pointer-events: none; z-index: 10;
    transition: opacity 1.2s ease;
    backdrop-filter: blur(6px);
  }
  #replay.show { opacity: 1; pointer-events: auto; }
  #replay:active { transform: translateX(-50%) scale(0.96); }
</style>
</head>
<body>

<div id="flash"></div>
<button id="skip">saltar ✕</button>
<button id="replay">✨ Ver de nuevo</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // CONFIG
  // ---------------------------------------------------------------
  var isSmall = window.innerWidth < 700;
  var GALAXY_COUNT = isSmall ? 6500 : 11000;
  var STAR_COUNT   = isSmall ? 1200 : 2200;
  var TEXT_COUNT   = isSmall ? 4200 : 6500;

  var TIMELINE = {
    seedEnd:        2.0,
    galaxyFormEnd:  5.5,
    galaxyHoldEnd:  15.5,
    toText1End:     18.5,
    text1End:       22.5,
    toText2Start:   22.5,
    toText2End:     25.5,
    text2End:       29.5,
    toText3Start:   29.5,
    toText3End:     32.5,
    finalHold:      33.5
  };

  var MESSAGES = ["Te extraño mucho","ojitos lindos lo mereces todo","Feliz Cumpleaños"\u2764"];

  // ---------------------------------------------------------------
  // BASIC SETUP
  // ---------------------------------------------------------------
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.2, 15);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var clock = new THREE.Clock();

  // soft round sprite for particles
  function createDiscTexture() {
    var size = 64;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.75)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }
  var discTexture = createDiscTexture();

  // ---------------------------------------------------------------
  // DISTANT BACKGROUND STARS (static, subtle twinkle)
  // ---------------------------------------------------------------
  var bgGeo = new THREE.BufferGeometry();
  var bgPos = new Float32Array(STAR_COUNT * 3);
  var bgPhase = new Float32Array(STAR_COUNT);
  for (var i = 0; i < STAR_COUNT; i++) {
    var r = 40 + Math.random() * 60;
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.acos(2 * Math.random() - 1);
    bgPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    bgPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    bgPos[i*3+2] = r * Math.cos(phi);
    bgPhase[i] = Math.random() * Math.PI * 2;
  }
  bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
  var bgMat = new THREE.PointsMaterial({
    size: 0.09, map: discTexture, color: 0xffffff, transparent: true,
    opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  var bgStars = new THREE.Points(bgGeo, bgMat);
  scene.add(bgStars);

  // ---------------------------------------------------------------
  // GALAXY (seed -> spiral galaxy), lives inside a rotating group
  // ---------------------------------------------------------------
  var universe = new THREE.Group();
  scene.add(universe);

  function generateSeed(count) {
    var pos = new Float32Array(count * 3);
    var col = new Float32Array(count * 3);
    var warm = new THREE.Color('#fff3d6');
    for (var i = 0; i < count; i++) {
      var rr = Math.pow(Math.random(), 2) * 0.25;
      var th = Math.random() * Math.PI * 2;
      var ph = Math.acos(2 * Math.random() - 1);
      pos[i*3]   = rr * Math.sin(ph) * Math.cos(th);
      pos[i*3+1] = rr * Math.sin(ph) * Math.sin(th);
      pos[i*3+2] = rr * Math.cos(ph);
      col[i*3] = warm.r; col[i*3+1] = warm.g; col[i*3+2] = warm.b;
    }
    return { pos: pos, col: col };
  }

  function generateGalaxy(count) {
    var pos = new Float32Array(count * 3);
    var col = new Float32Array(count * 3);
    var inside = new THREE.Color('#ffe3b0');
    var outside = new THREE.Color('#7f9bff');
    var radiusMax = 6.2;
    var branches = 5;
    var spin = 1.35;
    var randomness = 0.45;
    var randomnessPower = 3;
    for (var i = 0; i < count; i++) {
      var i3 = i * 3;
      var radius = Math.pow(Math.random(), 0.7) * radiusMax;
      var branchAngle = ((i % branches) / branches) * Math.PI * 2;
      var spinAngle = radius * spin;
      var rx = Math.pow(Math.random(), randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * randomness * radius;
      var ry = Math.pow(Math.random(), randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * randomness * radius * 0.25;
      var rz = Math.pow(Math.random(), randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * randomness * radius;
      pos[i3]   = Math.cos(branchAngle + spinAngle) * radius + rx;
      pos[i3+1] = ry;
      pos[i3+2] = Math.sin(branchAngle + spinAngle) * radius + rz;
      var mixed = inside.clone().lerp(outside, radius / radiusMax);
      col[i3] = mixed.r; col[i3+1] = mixed.g; col[i3+2] = mixed.b;
    }
    return { pos: pos, col: col };
  }

  var seedShape = generateSeed(GALAXY_COUNT);
  var galaxyShape = generateGalaxy(GALAXY_COUNT);

  var galaxyGeo = new THREE.BufferGeometry();
  var galaxyLivePos = seedShape.pos.slice();
  var galaxyLiveCol = seedShape.col.slice();
  galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyLivePos, 3));
  galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyLiveCol, 3));
  var galaxyMat = new THREE.PointsMaterial({
    size: isSmall ? 0.075 : 0.06, map: discTexture, vertexColors: true,
    transparent: true, opacity: 1, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  var galaxyPoints = new THREE.Points(galaxyGeo, galaxyMat);
  universe.add(galaxyPoints);

  // glowing core
  var coreTex = discTexture;
  var coreMat = new THREE.SpriteMaterial({ map: coreTex, color: 0xfff2cf, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
  var core = new THREE.Sprite(coreMat);
  core.scale.set(2.6, 2.6, 1);
  universe.add(core);

  // ---------------------------------------------------------------
  // PLANETS
  // ---------------------------------------------------------------
  var ambient = new THREE.AmbientLight(0x333355, 1.2);
  scene.add(ambient);
  var coreLight = new THREE.PointLight(0xffe3b0, 2.2, 30);
  universe.add(coreLight);

  var planets = [];
  var planetDefs = [
    { color: 0x7ea8ff, radius: 0.32, orbit: 3.2, speed: 0.25, tilt: 0.15 },
    { color: 0xff9d7e, radius: 0.22, orbit: 4.4, speed: -0.18, tilt: -0.1 },
    { color: 0xc9a4ff, radius: 0.16, orbit: 2.2, speed: 0.4,  tilt: 0.05 }
  ];
  planetDefs.forEach(function (def) {
    var geo = new THREE.SphereGeometry(def.radius, 24, 24);
    var mat = new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.5, metalness: 0.2, transparent: true, opacity: 0 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.userData = { angle: Math.random() * Math.PI * 2, def: def };
    universe.add(mesh);
    planets.push(mesh);
  });

  // ---------------------------------------------------------------
  // METEORS (shooting stars)
  // ---------------------------------------------------------------
  var meteors = [];
  function spawnMeteor() {
    var startR = 9 + Math.random() * 4;
    var angle = Math.random() * Math.PI * 2;
    var start = new THREE.Vector3(Math.cos(angle) * startR, (Math.random() - 0.5) * 4, Math.sin(angle) * startR);
    var dir = new THREE.Vector3(-start.x, (Math.random() - 0.5) * 2, -start.z).normalize();
    var length = 1.4 + Math.random() * 1.2;
    var geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), dir.clone().multiplyScalar(-length)]);
    var mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
    var line = new THREE.Line(geo, mat);
    line.position.copy(start);
    scene.add(line);
    meteors.push({ mesh: line, dir: dir, speed: 6 + Math.random() * 4, life: 0, maxLife: 1.2 });
  }
  var nextMeteorAt = 3.0;

  // ---------------------------------------------------------------
  // TEXT PARTICLES (separate static group)
  // ---------------------------------------------------------------
  var textGroup = new THREE.Group();
  scene.add(textGroup);

  function sampleTextPoints(text, count) {
    var w = 1500, h = 420;
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fontSize = 160;
    ctx.font = "800 " + fontSize + "px Poppins, sans-serif";
    var m = ctx.measureText(text);
    while (m.width > w * 0.86 && fontSize > 24) {
      fontSize -= 4;
      ctx.font = "800 " + fontSize + "px Poppins, sans-serif";
      m = ctx.measureText(text);
    }
    ctx.fillText(text, w / 2, h / 2);
    var data = ctx.getImageData(0, 0, w, h).data;
    var candidates = [];
    var step = isSmall ? 4 : 3;
    for (var y = 0; y < h; y += step) {
      for (var x = 0; x < w; x += step) {
        var idx = (y * w + x) * 4;
        if (data[idx + 3] > 120) {
          candidates.push([ (x - w / 2) / (w / 2) * 6.6, -(y - h / 2) / (h / 2) * 1.85 ]);
        }
      }
    }
    // shuffle
    for (var k = candidates.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var tmp = candidates[k]; candidates[k] = candidates[j]; candidates[j] = tmp;
    }
    var pts = new Float32Array(count * 3);
    var n = Math.max(candidates.length, 1);
    for (var i = 0; i < count; i++) {
      var c = candidates[i % n];
      var jitter = candidates.length < count ? 0.03 : 0;
      pts[i*3]   = c[0] + (Math.random() - 0.5) * jitter;
      pts[i*3+1] = c[1] + (Math.random() - 0.5) * jitter;
      pts[i*3+2] = (Math.random() - 0.5) * 0.4;
    }
    return pts;
  }

  var textColorSets = [
    new THREE.Color('#ffd9e8'), // Te extraño mucho - rosado suave
    new THREE.Color('#ffe9b0'), // Ojitos lindos lo mereces todo - dorado cálido
    new THREE.Color('#ffd27a')  // Feliz cumpleaños - dorado brillante
  ];

  function buildTextColor(count, color) {
    var col = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      col[i*3] = color.r; col[i*3+1] = color.g; col[i*3+2] = color.b;
    }
    return col;
  }

  var textGeo = new THREE.BufferGeometry();
  var textLivePos = new Float32Array(TEXT_COUNT * 3);
  var textLiveCol = new Float32Array(TEXT_COUNT * 3);
  textGeo.setAttribute('position', new THREE.BufferAttribute(textLivePos, 3));
  textGeo.setAttribute('color', new THREE.BufferAttribute(textLiveCol, 3));
  var textMat = new THREE.PointsMaterial({
    size: isSmall ? 0.09 : 0.075, map: discTexture, vertexColors: true,
    transparent: true, opacity: 0, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  var textPoints = new THREE.Points(textGeo, textMat);
  textGroup.add(textPoints);

  var textShapes = null; // filled once fonts ready
  var textShapesReady = false;

  // final bright flare sprite for the last message
  var flareMat = new THREE.SpriteMaterial({ map: discTexture, color: 0xfff2c0, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
  var flare = new THREE.Sprite(flareMat);
  flare.scale.set(0.001, 0.001, 1);
  textGroup.add(flare);

  // ---------------------------------------------------------------
  // HELPERS
  // ---------------------------------------------------------------
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function smoothstep(t) { t = clamp01(t); return t * t * (3 - 2 * t); }
  function lerpArrays(from, to, t, out) {
    for (var i = 0; i < out.length; i++) out[i] = from[i] + (to[i] - from[i]) * t;
  }

  var camKeys = [
    { t: 0.0,  pos: [0, 1.4, 15],  look: [0, 0, 0] },
    { t: 2.0,  pos: [0, 1.1, 10.5],look: [0, 0, 0] },
    { t: 5.5,  pos: [0, 2.6, 9.5], look: [0, 0, 0] },
    { t: 12.0, pos: [0, 1.6, 7.6], look: [0, 0, 0] },
    { t: 16.5, pos: [0, 0.3, 8.4], look: [0, 0, 0] },
    { t: 19.0, pos: [0, 0, 7.6],   look: [0, 0, 0] },
    { t: 34.0, pos: [0, 0, 7.1],   look: [0, 0, 0] }
  ];
  var camPosTmp = new THREE.Vector3();
  var camLookTmp = new THREE.Vector3();
  function updateCamera(t) {
    var k0 = camKeys[0], k1 = camKeys[camKeys.length - 1];
    for (var i = 0; i < camKeys.length - 1; i++) {
      if (t >= camKeys[i].t && t <= camKeys[i+1].t) { k0 = camKeys[i]; k1 = camKeys[i+1]; break; }
      if (t > camKeys[camKeys.length - 1].t) { k0 = k1 = camKeys[camKeys.length - 1]; }
    }
    var span = Math.max(0.0001, k1.t - k0.t);
    var lt = smoothstep((t - k0.t) / span);
    camPosTmp.set(
      k0.pos[0] + (k1.pos[0] - k0.pos[0]) * lt,
      k0.pos[1] + (k1.pos[1] - k0.pos[1]) * lt,
      k0.pos[2] + (k1.pos[2] - k0.pos[2]) * lt
    );
    camLookTmp.set(
      k0.look[0] + (k1.look[0] - k0.look[0]) * lt,
      k0.look[1] + (k1.look[1] - k0.look[1]) * lt,
      k0.look[2] + (k1.look[2] - k0.look[2]) * lt
    );
    camera.position.copy(camPosTmp);
    camera.lookAt(camLookTmp);
  }

  var flashed = false;
  function triggerFlash() {
    if (flashed) return;
    flashed = true;
    var el = document.getElementById('flash');
    var start = performance.now();
    function anim() {
      var e = (performance.now() - start) / 900;
      if (e < 1) {
        var v = Math.sin(Math.min(e,1) * Math.PI);
        el.style.opacity = (v * 0.55).toFixed(3);
        requestAnimationFrame(anim);
      } else {
        el.style.opacity = 0;
      }
    }
    requestAnimationFrame(anim);
  }

  var replayBtn = document.getElementById('replay');
  var skipBtn = document.getElementById('skip');
  replayBtn.addEventListener('click', function () { window.location.reload(); });
  var skipped = false;
  skipBtn.addEventListener('click', function () {
    skipped = true;
    clock.elapsedOverride = TIMELINE.toText3End + 0.05;
  });

  // ---------------------------------------------------------------
  // FONT LOAD -> BUILD TEXT SHAPES
  // ---------------------------------------------------------------
  function buildTextShapes() {
    textShapes = MESSAGES.map(function (msg, idx) {
      return { pos: sampleTextPoints(msg, TEXT_COUNT), col: buildTextColor(TEXT_COUNT, textColorSets[idx]) };
    });
    textShapesReady = true;
  }

  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('800 160px Poppins'),
      document.fonts.load('700 160px Poppins')
    ]).catch(function(){}).then(function () {
      document.fonts.ready.then(buildTextShapes).catch(buildTextShapes);
    });
    // safety fallback in case font promises hang
    setTimeout(function () { if (!textShapesReady) buildTextShapes(); }, 1800);
  } else {
    buildTextShapes();
  }

  // ---------------------------------------------------------------
  // MAIN LOOP
  // ---------------------------------------------------------------
  var skipTimeOffset = 0;
  var scratchPos = new Float32Array(GALAXY_COUNT * 3);
  var scratchCol = new Float32Array(GALAXY_COUNT * 3);
  var scratchTPos = new Float32Array(TEXT_COUNT * 3);
  var scratchTCol = new Float32Array(TEXT_COUNT * 3);

  var uiShown = { skip: false, replay: false };

  function animate() {
    requestAnimationFrame(animate);
    var delta = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedOverride !== undefined ? clock.elapsedOverride : clock.getElapsedTime();

    // twinkle bg stars very subtly via opacity pulse (cheap: whole-field pulse)
    bgMat.opacity = 0.5 + Math.sin(t * 0.6) * 0.08;

    // ---- SEED -> GALAXY morph ----
    if (t <= TIMELINE.seedEnd) {
      galaxyGeo.attributes.position.array.set(seedShape.pos);
      galaxyGeo.attributes.color.array.set(seedShape.col);
      galaxyMat.size = (isSmall ? 0.06 : 0.05) + Math.sin(t * 3) * 0.01;
    } else if (t <= TIMELINE.galaxyFormEnd) {
      var lt1 = smoothstep((t - TIMELINE.seedEnd) / (TIMELINE.galaxyFormEnd - TIMELINE.seedEnd));
      lerpArrays(seedShape.pos, galaxyShape.pos, lt1, scratchPos);
      lerpArrays(seedShape.col, galaxyShape.col, lt1, scratchCol);
      galaxyGeo.attributes.position.array.set(scratchPos);
      galaxyGeo.attributes.color.array.set(scratchCol);
      galaxyMat.size = isSmall ? 0.075 : 0.06;
    } else if (t <= TIMELINE.toText1End) {
      galaxyGeo.attributes.position.array.set(galaxyShape.pos);
      galaxyGeo.attributes.color.array.set(galaxyShape.col);
    }
    galaxyGeo.attributes.position.needsUpdate = true;
    galaxyGeo.attributes.color.needsUpdate = true;

    // core glow fade in/out
    var coreOpacity = 0;
    if (t > TIMELINE.seedEnd - 0.4) {
      coreOpacity = smoothstep((t - (TIMELINE.seedEnd - 0.4)) / 1.2);
    }
    if (t > TIMELINE.galaxyHoldEnd) {
      coreOpacity *= 1 - smoothstep((t - TIMELINE.galaxyHoldEnd) / (TIMELINE.toText1End - TIMELINE.galaxyHoldEnd));
    }
    coreMat.opacity = coreOpacity * 0.85;

    // universe (galaxy) rotation - slows to a stop before the text phase
    var rotSpeed = 0.12;
    if (t > TIMELINE.galaxyHoldEnd - 2.5) {
      var slow = 1 - smoothstep((t - (TIMELINE.galaxyHoldEnd - 2.5)) / 2.5);
      rotSpeed *= slow;
    }
    universe.rotation.y += rotSpeed * delta;

    // whole galaxy group fade-out into the text phase
    var galaxyFade = 1;
    if (t > TIMELINE.galaxyHoldEnd) {
      galaxyFade = 1 - smoothstep((t - TIMELINE.galaxyHoldEnd) / (TIMELINE.toText1End - TIMELINE.galaxyHoldEnd));
    }
    galaxyMat.opacity = galaxyFade;

    // planets: fade in during hold, orbit, fade out with galaxy
    var planetFade = 0;
    if (t > 6.5) planetFade = smoothstep((t - 6.5) / 2.0);
    if (t > TIMELINE.galaxyHoldEnd) {
      planetFade *= (1 - smoothstep((t - TIMELINE.galaxyHoldEnd) / (TIMELINE.toText1End - TIMELINE.galaxyHoldEnd)));
    }
    planets.forEach(function (p) {
      var d = p.userData.def;
      p.userData.angle += d.speed * delta * 0.3;
      p.position.set(
        Math.cos(p.userData.angle) * d.orbit,
        Math.sin(t * 0.3 + d.orbit) * 0.3 * d.tilt * 4,
        Math.sin(p.userData.angle) * d.orbit
      );
      p.material.opacity = planetFade * 0.95;
    });
    coreLight.intensity = 2.2 * (0.3 + galaxyFade * 0.7);

    // meteors
    if (t > 3 && t < TIMELINE.galaxyHoldEnd && t > nextMeteorAt) {
      spawnMeteor();
      nextMeteorAt = t + 1.4 + Math.random() * 2.2;
    }
    for (var mi = meteors.length - 1; mi >= 0; mi--) {
      var mObj = meteors[mi];
      mObj.life += delta;
      var progress = mObj.life / mObj.maxLife;
      mObj.mesh.position.addScaledVector(mObj.dir, mObj.speed * delta);
      mObj.mesh.material.opacity = 0.9 * (1 - smoothstep(progress));
      if (progress >= 1) {
        scene.remove(mObj.mesh);
        mObj.mesh.geometry.dispose();
        mObj.mesh.material.dispose();
        meteors.splice(mi, 1);
      }
    }

    // ---- TEXT PHASE ----
    if (textShapesReady) {
      var s0 = textShapes[0], s1 = textShapes[1], s2 = textShapes[2];
      var textOpacity = 0;
      var curPos = null, curCol = null;

      if (t <= TIMELINE.galaxyHoldEnd) {
        // not shown yet
      } else if (t <= TIMELINE.toText1End) {
        var ltA = smoothstep((t - TIMELINE.galaxyHoldEnd) / (TIMELINE.toText1End - TIMELINE.galaxyHoldEnd));
        curPos = s0.pos; curCol = s0.col;
        textOpacity = ltA;
      } else if (t <= TIMELINE.text1End) {
        curPos = s0.pos; curCol = s0.col;
        textOpacity = 1;
      } else if (t <= TIMELINE.toText2End) {
        var ltB = smoothstep((t - TIMELINE.toText2Start) / (TIMELINE.toText2End - TIMELINE.toText2Start));
        lerpArrays(s0.pos, s1.pos, ltB, scratchTPos);
        lerpArrays(s0.col, s1.col, ltB, scratchTCol);
        curPos = scratchTPos; curCol = scratchTCol;
        textOpacity = 1;
      } else if (t <= TIMELINE.text2End) {
        curPos = s1.pos; curCol = s1.col;
        textOpacity = 1;
      } else if (t <= TIMELINE.toText3End) {
        var ltC = smoothstep((t - TIMELINE.toText3Start) / (TIMELINE.toText3End - TIMELINE.toText3Start));
        lerpArrays(s1.pos, s2.pos, ltC, scratchTPos);
        lerpArrays(s1.col, s2.col, ltC, scratchTCol);
        curPos = scratchTPos; curCol = scratchTCol;
        textOpacity = 1;
        if (ltC > 0.96) triggerFlash();
      } else {
        curPos = s2.pos; curCol = s2.col;
        textOpacity = 1;
      }

      if (curPos) {
        textGeo.attributes.position.array.set(curPos);
        textGeo.attributes.color.array.set(curCol);
        textGeo.attributes.position.needsUpdate = true;
        textGeo.attributes.color.needsUpdate = true;
      }
      textMat.opacity = textOpacity;

      // gentle breathing rotation, only while text visible
      textGroup.rotation.y = Math.sin(t * 0.25) * 0.035;
      textGroup.rotation.x = Math.sin(t * 0.18) * 0.015;

      // final flare
      if (t > TIMELINE.toText3End) {
        var flt = smoothstep((t - TIMELINE.toText3End) / 1.4);
        flare.material.opacity = flt * 0.55 * (0.85 + Math.sin(t * 2) * 0.15);
        var sc = 1.4 + flt * 1.4 + Math.sin(t * 2) * 0.15;
        flare.scale.set(sc, sc, 1);
        flare.position.set(0, 0.05, 0.3);
      }
    }

    // UI reveal
  if (!uiShown.skip && t > 1 && t < TIMELINE.finalHold) {
      skipBtn.classList.add('show'); uiShown.skip = true;
    }
    if (t >= TIMELINE.finalHold) {
      skipBtn.classList.remove('show');
      if (!uiShown.replay) { replayBtn.classList.add('show'); uiShown.replay = true; }
    }

    updateCamera(t);
    renderer.render(scene, camera);
  }

  animate();
})();
</script>
