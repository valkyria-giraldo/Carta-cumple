<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Juan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Caveat:wght@500;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --noche-1:#0b0f24;
    --noche-2:#1b2148;
    --noche-3:#2c3568;
    --oro:#f0c869;
    --rosa:#e7a6a0;
    --texto:#f1eee6;
    --papel:#f6f1e7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:linear-gradient(180deg, var(--noche-1), var(--noche-2) 45%, var(--noche-3));
    color:var(--texto);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  body.bloqueado{ overflow:hidden; height:100vh; }

  #estrellas{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .estrella-fondo{
    position:absolute; width:2px; height:2px; background:#fff;
    border-radius:50%; opacity:.6;
    animation:titilar 3s ease-in-out infinite;
  }
  @keyframes titilar{ 50%{ opacity:.15; } }

  .corazon-fondo{
    position:absolute; bottom:-5vh; font-size:1rem; color:var(--rosa);
    opacity:.55; filter:drop-shadow(0 0 4px rgba(231,166,160,.5));
    animation:ascender linear forwards;
  }
  @keyframes ascender{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.6; }
    90%{ opacity:.5; }
    100%{ transform:translateY(-110vh) translateX(var(--deriva,20px)) rotate(20deg); opacity:0; }
  }

  #portada{
    position:fixed; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:10vw;
    background:radial-gradient(circle at 50% 40%, var(--noche-3), var(--noche-1) 75%);
    transition:opacity .9s ease, transform .9s ease;
    cursor:pointer;
  }
  #portada.abierta{ opacity:0; transform:scale(1.06); pointer-events:none; }
  #portada h1{
    font-family:'Playfair Display', serif; font-style:italic; font-weight:600;
    font-size:clamp(1.4rem, 6.5vw, 2.1rem); line-height:1.5; max-width:18ch;
    white-space:pre-line;
  }
  #portada .toque{
    margin-top:3rem; font-size:.8rem; letter-spacing:.2em; opacity:.55;
    text-transform:uppercase; animation:flotar 2.2s ease-in-out infinite;
  }

  section{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:8vh 8vw;
  }

  .oculto{ opacity:0; transform:translateY(24px); transition:opacity 1s ease, transform 1s ease; }
  .visible{ opacity:1; transform:translateY(0); }

  h1,h2{ font-family:'Playfair Display', serif; font-weight:700; }
  h1{ font-size:clamp(2rem, 8vw, 3.2rem); }
  h2{ font-size:clamp(1.5rem, 6vw, 2.2rem); color:var(--oro); margin-bottom:1.2rem; }

  p{ font-size:1.05rem; line-height:1.7; max-width:34ch; font-weight:300; }

  .manuscrita{
    font-family:'Caveat', cursive;
    font-size:clamp(1.5rem, 5.4vw, 2rem);
    color:var(--rosa);
    line-height:1.5;
    max-width:26ch;
  }

  .scroll-hint{
    position:absolute; bottom:6vh; font-size:.85rem; letter-spacing:.15em;
    opacity:.6; animation:flotar 2.2s ease-in-out infinite;
  }
  @keyframes flotar{ 50%{ transform:translateY(8px); } }

  .escribir{ white-space:pre-line; cursor:pointer; }
  .escribiendo::after{
    content:'|'; display:inline-block; margin-left:2px;
    animation:parpadeo .8s steps(1) infinite;
  }
  @keyframes parpadeo{ 50%{ opacity:0; } }

  .hoja{
    background:linear-gradient(160deg, var(--papel), #ece4d2);
    color:#3a2f2f;
    border-radius:6px 14px 6px 14px;
    padding:2rem 1.8rem;
    max-width:min(88vw, 380px);
    box-shadow:0 18px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.04);
    transform:rotate(-1.2deg);
  }
  .hoja-cerrada{
    display:none;
    opacity:0; transform:rotate(-1.2deg) scale(.85) translateY(16px);
  }
  .hoja-cerrada.hoja-abierta{
    display:block;
    animation:abrirHoja .6s ease forwards;
  }
  @keyframes abrirHoja{
    from{ opacity:0; transform:rotate(-1.2deg) scale(.85) translateY(16px); }
    to{ opacity:1; transform:rotate(-1.2deg) scale(1) translateY(0); }
  }
  .hoja .manuscrita{ color:#5c3b3b; max-width:none; }
  .hoja .escribiendo::after{ color:#5c3b3b; }
  .sello{
    width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d98b8b, #9c3f3f);
    display:flex; align-items:center; justify-content:center;
    color:#f6e9e9; font-size:1rem; margin:0 auto 1rem;
    box-shadow:0 3px 8px rgba(0,0,0,.4);
  }

  /* ---------- CORAZÓN DISPARADOR DE CARTA ---------- */
  .disparador-carta.oculta-tras-abrir{ display:none; }
  .corazon-toque{
    font-size:3rem; color:var(--rosa); cursor:pointer;
    filter:drop-shadow(0 0 10px rgba(231,166,160,.6));
    animation:latido 1.6s ease-in-out infinite;
  }
  .pista-toque{
    margin-top:.8rem; font-size:.85rem; opacity:.6; letter-spacing:.05em;
  }

  #constelacion-wrap{ width:min(90vw, 420px); }
  #constelacion{ width:100%; height:auto; }
  .linea-conexion{
    fill:none; stroke:var(--oro); stroke-width:1.5;
    stroke-dasharray:400; stroke-dashoffset:400;
    transition:stroke-dashoffset 2.2s ease;
  }
  .linea-conexion.dibujar{ stroke-dashoffset:0; }
  .punto{ fill:var(--texto); }
  .punto.tu{ fill:var(--rosa); }
  .etiqueta{ font-family:'Caveat', cursive; font-size:22px; fill:var(--texto); }
  .corazon-centro{
    font-size:20px; opacity:0; transform-origin:center;
    animation:latido 1.6s ease-in-out infinite;
  }
  .visible .corazon-centro{ opacity:.8; }
  @keyframes latido{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.25); } }

  .campo-sorpresas{
    position:relative; width:min(90vw, 420px); height:280px;
    margin-top:2rem;
  }
  .estrella-click{
    position:absolute; background:none; border:none; cursor:pointer;
    font-size:1.6rem; color:var(--oro); line-height:1;
    filter:drop-shadow(0 0 6px rgba(240,200,105,.6));
    transition:transform .3s ease;
  }
  .estrella-click:active{ transform:scale(1.3); }
  .mensaje-sorpresa{
    position:absolute; max-width:220px; background:rgba(27,33,72,.95);
    border:1px solid var(--oro); border-radius:10px; padding:.8rem 1rem;
    font-family:'Caveat', cursive; font-size:1.2rem; color:var(--texto);
    opacity:0; pointer-events:none; transition:opacity .3s ease;
    z-index:5;
  }
  .mensaje-sorpresa.activo{ opacity:1; pointer-events:auto; }

  #torta{ font-size:4rem; cursor:pointer; user-select:none; }
  .confeti{
    position:fixed; top:-10px; width:8px; height:14px; z-index:10; pointer-events:none;
  }
</style>
</head>
<body class="bloqueado">

<div id="estrellas"></div>

<div id="portada">
  <h1 class="escribir" id="intro" data-velocidad="38" data-texto="Para alguien que está lejos&#10;pero que de alguna forma&#10;se siente cerca. ✨"></h1>
  <div class="toque">toca para abrir</div>
</div>

<section>
  <h2 class="oculto escribir" data-texto="Qué bonito coincidir"></h2>
  <div id="constelacion-wrap" class="oculto">
    <svg id="constelacion" viewBox="0 0 400 200">
      <path class="linea-conexion" id="linea" d="M 60 150 Q 200 20 340 150" />
      <circle class="punto" cx="60" cy="150" r="5"/>
      <text class="etiqueta" x="30" y="180">yo</text>
      <circle class="punto tu" cx="340" cy="150" r="5"/>
      <text class="etiqueta" x="320" y="180">tú</text>
      <text class="corazon-centro" x="190" y="55" fill="#e7a6a0">♥</text>
    </svg>
  </div>
  <p class="oculto escribir" data-texto="La vida y los kilómetros nos pusieron lejos, pero tú vives en mi cabeza desde que te ví, incluso desde mucho antes."></p>
</section>

<section>
  <h2 class="oculto escribir" data-texto="Toca las estrellas y corazones"></h2>
  <p class="oculto" style="margin-bottom:1rem;">hay algo escondido en cada una</p>
  <div class="campo-sorpresas oculto" id="campo"></div>
</section>

<section>
  <div class="disparador-carta oculto" data-carta="carta1">
    <div class="corazon-toque">♥</div>
    <p class="pista-toque">toca el corazón para abrir</p>
  </div>
  <div class="hoja hoja-cerrada" id="carta1">
    <div class="sello">♥</div>
    <p class="manuscrita escribir" data-velocidad="20" data-texto="A veces la distancia hace extraño eso de conocer a alguien. Porque estás lejos, pero aun así logras aparecer en mis pensamientos más de lo que imaginas. Y aunque hoy no pueda estar ahí contigo, quería encontrar una forma de acercarme un poquito a ti."></p>
  </div>
</section>

<section>
  <div class="disparador-carta oculto" data-carta="carta2">
    <div class="corazon-toque">♥</div>
    <p class="pista-toque">toca el corazón otra vez</p>
  </div>
  <div class="hoja hoja-cerrada" id="carta2">
<p class="manuscrita escribir" data-velocidad="18" data-texto="Feliz cumpleaños ✨&#10;&#10;Espero que este nuevo año de vida te encuentre rodeado de cosas bonitas, de sueños que comiencen a cumplirse y de momentos que te hagan sonreír de verdad.&#10;&#10;Me alegra tanto haberte conocido. Quizás la vida tiene formas curiosas de acercarnos a las personas, incluso cuando existen kilómetros de por medio. Y aunque no sé qué nos depare el tiempo, sí sé que me gusta coincidir contigo. 💗"></p>
  </div>  
  <div id="torta" class="oculto" style="margin-top:1.5rem;">🎂</div>
  <p class="oculto" style="margin-top:.5rem; opacity:.7; font-size:.85rem;">(toca la torta)</p>
</section>

<section>
  <div class="disparador-carta oculto" data-carta="carta3">
    <div class="corazon-toque">♥</div>
    <p class="pista-toque">toca el corazón la última vez</p>
  </div>
  <div class="hoja hoja-cerrada" id="carta3">
    <p class="manuscrita escribir" data-velocidad="20" data-texto="Hoy no puedo estar cerca para celebrarte como quisiera pero quería que, aunque fuera desde lejos, recibieras un pequeño pedacito de cariño mío.&#10;&#10;Mi amor bonito. 🎂🤍&#10;Que la vida te devuelva toda la luz bonita que llevas dentro."></p>
  </div>
</section>

<script>
const fondo = document.getElementById('estrellas');
for(let i=0;i<70;i++){
  const s = document.createElement('div');
  s.className='estrella-fondo';
  s.style.left = Math.random()*100+'vw';
  s.style.top = Math.random()*100+'vh';
  s.style.animationDelay = (Math.random()*3)+'s';
  fondo.appendChild(s);
}

const sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function crearCorazonFondo(){
  if(sinMovimiento) return;
  const c = document.createElement('div');
  c.className='corazon-fondo';
  c.textContent='♥';
  c.style.left = Math.random()*100+'vw';
  c.style.setProperty('--deriva', (Math.random()*60-30)+'px');
  const duracion = 9 + Math.random()*7;
  c.style.animationDuration = duracion+'s';
  c.style.fontSize = (0.7 + Math.random()*0.9)+'rem';
  fondo.appendChild(c);
  setTimeout(()=>c.remove(), duracion*1000);
}
for(let i=0;i<10;i++) setTimeout(crearCorazonFondo, i*600);
setInterval(crearCorazonFondo, 1400);

function lanzarRafagaCorazones(cantidad){
  for(let i=0;i<cantidad;i++){
    const c = document.createElement('div');
    c.textContent='♥';
    c.style.position='fixed';
    c.style.left='50%'; c.style.top='45%';
    c.style.fontSize=(1+Math.random()*1.3)+'rem';
    c.style.color = Math.random()<0.5 ? 'var(--rosa)' : 'var(--oro)';
    c.style.zIndex=50;
    c.style.pointerEvents='none';
    const angulo = Math.random()*Math.PI*2;
    const distancia = 90+Math.random()*170;
    const dx = Math.cos(angulo)*distancia;
    const dy = Math.sin(angulo)*distancia - 70;
    document.body.appendChild(c);
    const dur = 1300+Math.random()*900;
    c.animate([
      { transform:'translate(-50%,-50%) scale(.4)', opacity:0 },
      { transform:`translate(calc(-50% + ${dx*0.5}px), calc(-50% + ${dy*0.5}px)) scale(1)`, opacity:1, offset:.3 },
      { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy - 50}px)) scale(.7)`, opacity:0 }
    ], { duration:dur, easing:'ease-out' });
    setTimeout(()=>c.remove(), dur);
  }
}

function escribirTexto(el){
  if(el.dataset.tipeado) return;
  el.dataset.tipeado = '1';
  const texto = el.dataset.texto || '';
  const velocidad = parseInt(el.dataset.velocidad || '30', 10);
  el.textContent = '';
  el.classList.add('escribiendo');
  let i = 0;
  function paso(){
    if(el.dataset.saltar==='1'){
      el.textContent = texto;
      el.classList.remove('escribiendo');
      return;
    }
    if(i <= texto.length){
      el.textContent = texto.slice(0, i);
      i++;
      setTimeout(paso, velocidad);
    } else {
      el.classList.remove('escribiendo');
    }
  }
  paso();
  el.addEventListener('click', (ev)=>{ ev.stopPropagation(); el.dataset.saltar='1'; }, {once:true});
}

const portada = document.getElementById('portada');
const introEl = document.getElementById('intro');
escribirTexto(introEl);

function abrirTarjeta(){
  if(portada.classList.contains('abierta')) return;
  portada.classList.add('abierta');
  lanzarRafagaCorazones(26);
  document.body.classList.remove('bloqueado');
  setTimeout(()=>{ portada.style.display='none'; }, 950);
}
portada.addEventListener('click', ()=>{ abrirTarjeta(); });

const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible');
      if(e.target.id==='constelacion-wrap'){
        document.getElementById('linea').classList.add('dibujar');
      }
      if(e.target.classList.contains('escribir')){
        escribirTexto(e.target);
      }
    }
  });
},{threshold:.35});
document.querySelectorAll('.oculto').forEach(el=>observer.observe(el));

// ---------- abrir cada carta al tocar su corazón ----------
document.querySelectorAll('.disparador-carta').forEach(disp=>{
  const corazon = disp.querySelector('.corazon-toque');
  const carta = document.getElementById(disp.dataset.carta);
  corazon.addEventListener('click', ()=>{
    carta.classList.add('hoja-abierta');
    disp.classList.add('oculta-tras-abrir');
    lanzarRafagaCorazones(16);
    const texto = carta.querySelector('.escribir');
    if(texto) escribirTexto(texto);
  });
});

const mensajesSorpresa = [
  "Me encantas tanto.",
  "Ojalá un día veas lo increíble que eres, como yo lo veo.",
  "Te admiro demasiado,tu valentía, todo todo.",
  "Quiero volverte a ver y espero que sea pronto.",
  "No somos nada pero... yo no sé, yo por usted siento todo."
];
const campo = document.getElementById('campo');
mensajesSorpresa.forEach((msg, i)=>{
  const btn = document.createElement('button');
  btn.className='estrella-click';
  btn.textContent = (i % 2 === 0) ? '✦' : '♥';
  btn.style.left = (10 + Math.random()*75)+'%';
  btn.style.top = (10 + Math.random()*70)+'%';

  const globo = document.createElement('div');
  globo.className='mensaje-sorpresa';
  globo.textContent = msg;
  globo.style.left = btn.style.left;
  globo.style.top = btn.style.top;

  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.mensaje-sorpresa').forEach(g=>g.classList.remove('activo'));
    globo.classList.add('activo');
    setTimeout(()=>globo.classList.remove('activo'), 3500);
  });

  campo.appendChild(btn);
  campo.appendChild(globo);
});

document.getElementById('torta').addEventListener('click', ()=>{
  lanzarConfeti();
  lanzarRafagaCorazones(14);
});
function lanzarConfeti(){
  const colores=['#f0c869','#e7a6a0','#f1eee6','#8ea7e8'];
  for(let i=0;i<60;i++){
    const c = document.createElement('div');
    const esCorazon = Math.random() < 0.35;
    c.className='confeti';
    c.style.left = Math.random()*100+'vw';
    if(esCorazon){
      c.textContent='♥';
      c.style.width='auto'; c.style.height='auto';
      c.style.fontSize=(0.8+Math.random()*0.6)+'rem';
      c.style.color = colores[Math.floor(Math.random()*colores.length)];
    } else {
      c.style.background = colores[Math.floor(Math.random()*colores.length)];
    }
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    const duracion = 2500 + Math.random()*1500;
    c.animate([
      { transform:`translateY(0) rotate(0deg)`, opacity:1 },
      { transform:`translateY(100vh) rotate(${360+Math.random()*360}deg)`, opacity:.9 }
    ], { duration:duracion, easing:'ease-in' });
    setTimeout(()=>c.remove(), duracion);
  }
}

if(sinMovimiento){
  document.querySelectorAll('.oculto').forEach(el=>el.classList.add('visible'));
  document.querySelectorAll('.hoja-cerrada').forEach(el=>el.classList.add('hoja-abierta'));
  document.querySelectorAll('.escribir').forEach(el=>{
    el.dataset.tipeado='1';
    el.textContent = el.dataset.texto || '';
  });
  portada.style.display='none';
  document.body.classList.remove('bloqueado');
}
</script>
</body>
</html>
